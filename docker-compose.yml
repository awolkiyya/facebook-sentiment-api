services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    image: asi-laravel-api:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    working_dir: /var/www
    env_file:
      - .env
    expose:
      - "9000"
    volumes:
      - storage:/var/www/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - php artisan about --only=environment >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  queue-worker:
    image: asi-laravel-api:local
    restart: unless-stopped
    init: true
    working_dir: /var/www
    env_file:
      - .env
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=facebook,facebook-comments,facebook-ai,insights,default
      - --sleep=3
      - --tries=3
      - --timeout=90
    volumes:
      - storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    stop_grace_period: 100s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: asi-laravel-nginx:local
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      # HTTP router
      - "traefik.http.routers.facebook-sentiment-api.rule=Host(`196.190.216.57`) && (PathPrefix(`/api`) || PathPrefix(`/sanctum`))"
      - "traefik.http.routers.facebook-sentiment-api.entrypoints=web"
      - "traefik.http.routers.facebook-sentiment-api.priority=100"
      - "traefik.http.routers.facebook-sentiment-api.service=facebook-sentiment-api"

      # HTTPS router
      - "traefik.http.routers.facebook-sentiment-api-secure.rule=Host(`196.190.216.57`) && (PathPrefix(`/api`) || PathPrefix(`/sanctum`))"
      - "traefik.http.routers.facebook-sentiment-api-secure.entrypoints=websecure"
      - "traefik.http.routers.facebook-sentiment-api-secure.priority=100"
      - "traefik.http.routers.facebook-sentiment-api-secure.service=facebook-sentiment-api"
      - "traefik.http.routers.facebook-sentiment-api-secure.tls=true"
      - "traefik.http.routers.facebook-sentiment-api-secure.tls.certresolver=le"

      # Shared backend service
      - "traefik.http.services.facebook-sentiment-api.loadbalancer.server.port=80"

    volumes:
      - storage:/var/www/storage:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
      - traefik-public
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  storage:
  redis_data:

networks:
  backend:
    driver: bridge

  traefik-public:
    external: true
    name: traefik-public
