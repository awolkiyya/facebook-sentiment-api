server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # --------------------------------------------------------
    # Request limits and timeouts
    # --------------------------------------------------------
    client_max_body_size 52m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;

    # --------------------------------------------------------
    # Internal container health check
    # --------------------------------------------------------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --------------------------------------------------------
    # Security headers
    # --------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------
    # Deny hidden files and directories
    # --------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Never expose environment files, dependency metadata,
    # or repository files through HTTP.
    location ~* ^/(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json|artisan|phpunit\.xml|\.git)(?:/|$) {
        deny all;
    }

    # --------------------------------------------------------
    # Laravel routing
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------
    # Laravel front controller only
    # --------------------------------------------------------
    location = /index.php {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param SCRIPT_NAME /index.php;

        # Preserve request details for Laravel.
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $http_host;

        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        fastcgi_hide_header X-Powered-By;
    }

    # --------------------------------------------------------
    # Do not execute arbitrary PHP scripts
    # --------------------------------------------------------
    location ~ \.php(?:$|/) {
        return 404;
    }

    # --------------------------------------------------------
    # Logs
    # --------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
