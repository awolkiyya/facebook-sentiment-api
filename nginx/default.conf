
server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    client_max_body_size 52m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;

    # Health check for the internal HTTP server.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Do not expose hidden files, except the ACME challenge directory.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Laravel public assets and front-controller routing.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Execute Laravel's front controller through PHP-FPM.
    location = /index.php {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param SCRIPT_NAME /index.php;

        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        fastcgi_hide_header X-Powered-By;
    }

    # Never execute arbitrary PHP files from the public directory.
    location ~ \.php(?:$|/) {
        return 404;
    }

    # Avoid logging routine health-check requests.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
