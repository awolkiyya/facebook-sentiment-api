; ============================================================
; PHP 8.3 Production Settings — Laravel API
; ============================================================

; ------------------------------------------------------------
; Execution limits
; ------------------------------------------------------------
max_execution_time = 300
max_input_time = 300
default_socket_timeout = 60

; ------------------------------------------------------------
; Memory
; ------------------------------------------------------------
memory_limit = 512M

; ------------------------------------------------------------
; HTTP request and upload limits
; ------------------------------------------------------------
file_uploads = On
upload_max_filesize = 50M
post_max_size = 52M
max_file_uploads = 20
max_input_vars = 5000

; ------------------------------------------------------------
; Error handling
; Never expose PHP errors to API clients.
; ------------------------------------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
html_errors = Off
expose_php = Off
zend.exception_ignore_args = On

; ------------------------------------------------------------
; Response behavior
; Leave output buffering and response content types at PHP
; defaults. Laravel should determine its own response headers.
; ------------------------------------------------------------
output_buffering = 4096
implicit_flush = Off
default_charset = UTF-8

; ------------------------------------------------------------
; Sessions
; Laravel manages application sessions through its own
; configured session driver.
; ------------------------------------------------------------
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; ------------------------------------------------------------
; OPcache
; Timestamp validation is disabled for production performance.
; Rebuild/restart the app container after deploying code changes.
; ------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
