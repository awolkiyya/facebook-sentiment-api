; ============================================================
; PHP Production Settings — Laravel API
; ============================================================

; Execution limits
max_execution_time = 300
max_input_time = 300

; Memory
memory_limit = 512M

; Upload limits
file_uploads = On
upload_max_filesize = 50M
post_max_size = 52M
max_input_vars = 5000

; Error handling
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.enable_cli = 1
