name: Deploy Mayor Sentiment Laravel API

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      seed_database:
        description: "Run production database seeders after migrations"
        required: true
        type: boolean
        default: false

concurrency:
  group: mayor-sentiment-api-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Laravel API to ASI Serv
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      RUN_SEEDERS: ${{ inputs.seed_database || false }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RUN_SEEDERS: ${{ inputs.seed_database || false }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 35m
          envs: DEPLOY_PATH,RUN_SEEDERS

          script: |
            set -eu
            umask 077

            APP_DIR="${DEPLOY_PATH:-/opt/asi-platform/apps/facebook-sentiment-api}"
            BACKUP_DIR="/opt/asi-platform/backups/facebook-sentiment-api"

            WORKER_STOPPED=0
            CURRENT_STEP="Initializing deployment"
            BACKUP_FILE=""
            DEPLOY_COMMIT=""

            echo "=========================================="
            echo "Mayor Sentiment API Deployment"
            echo "Target: ASI Serv"
            echo "Application: $APP_DIR"
            echo "=========================================="

            # --------------------------------------------------
            # 1. Verify repository and Compose configuration
            # --------------------------------------------------

            CURRENT_STEP="Checking deployment prerequisites"
            echo ""
            echo "1. Checking deployment prerequisites..."

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: Git repository not found: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            docker --version
            docker compose version
            git --version

            if ! docker network inspect traefik-public >/dev/null 2>&1; then
              echo "ERROR: Docker network traefik-public is missing."
              exit 1
            fi

            if [ -f compose.yaml ]; then
              COMPOSE_FILE="compose.yaml"
            elif [ -f compose.yml ]; then
              COMPOSE_FILE="compose.yml"
            elif [ -f docker-compose.yml ]; then
              COMPOSE_FILE="docker-compose.yml"
            elif [ -f docker-compose.yaml ]; then
              COMPOSE_FILE="docker-compose.yaml"
            else
              echo "ERROR: Docker Compose file not found."
              exit 1
            fi

            dc() {
              docker compose -f "$COMPOSE_FILE" "$@"
            }

            if [ ! -f .env ] || [ ! -f .env.postgres ]; then
              echo "ERROR: Required .env or .env.postgres is missing."
              exit 1
            fi

            # Production secrets must not be group/world-readable.
            chmod 600 .env .env.postgres

            case "${RUN_SEEDERS:-false}" in
              true|false)
                ;;
              *)
                echo "ERROR: RUN_SEEDERS must be true or false."
                exit 1
                ;;
            esac

            # --------------------------------------------------
            # Failure handler
            # --------------------------------------------------

            on_exit() {
              STATUS=$?

              trap - EXIT

              if [ "$STATUS" -ne 0 ]; then
                set +e

                echo ""
                echo "=========================================="
                echo "DEPLOYMENT FAILED"
                echo "Exit code: $STATUS"
                echo "Last step: $CURRENT_STEP"
                echo "=========================================="

                echo ""
                echo "--- Container status ---"
                dc ps

                echo ""
                echo "--- Recent service logs ---"
                dc logs --tail=100 \
                  app nginx queue-worker postgres redis

                if [ "$WORKER_STOPPED" -eq 1 ]; then
                  echo ""
                  echo "--- Attempting queue-worker recovery ---"

                  # Start the existing stopped container where possible.
                  # Avoid implicitly recreating it with the new image
                  # when a deployment has failed before application rollout.
                  if dc start queue-worker; then
                    WORKER_CONTAINER="$(dc ps -q queue-worker)"

                    if [ -n "$WORKER_CONTAINER" ]; then
                      WORKER_STATE="$(
                        docker inspect \
                          --format '{{.State.Status}}' \
                          "$WORKER_CONTAINER" 2>/dev/null
                      )"

                      if [ "$WORKER_STATE" = "running" ]; then
                        echo "Queue worker recovery succeeded."
                      else
                        echo "WARNING: Queue worker state: $WORKER_STATE"
                        dc logs --tail=100 queue-worker
                      fi
                    else
                      echo "WARNING: Queue worker container was not found."
                    fi
                  else
                    echo "WARNING: Could not restart the existing queue worker."
                    echo "Check the worker container and database compatibility."
                  fi
                fi

                echo ""
                echo "No automatic database rollback was attempted."
                echo "Inspect migration status before retrying."
              fi

              exit "$STATUS"
            }

            trap on_exit EXIT

            # --------------------------------------------------
            # 2. Validate repository state
            # --------------------------------------------------

            CURRENT_STEP="Validating repository state"
            echo ""
            echo "2. Validating repository state..."

            CURRENT_BRANCH="$(git branch --show-current)"

            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "ERROR: Expected main branch, found '$CURRENT_BRANCH'."
              exit 1
            fi

            if git ls-files --error-unmatch .env >/dev/null 2>&1; then
              echo "ERROR: .env must not be tracked by Git."
              exit 1
            fi

            if git ls-files --error-unmatch .env.postgres >/dev/null 2>&1; then
              echo "ERROR: .env.postgres must not be tracked by Git."
              exit 1
            fi

            EXCLUDE_FILE="$(git rev-parse --git-path info/exclude)"
            touch "$EXCLUDE_FILE"

            if ! grep -qxF '/.env.postgres' "$EXCLUDE_FILE"; then
              printf '\n/.env.postgres\n' >> "$EXCLUDE_FILE"
            fi

            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
              echo "ERROR: Git working tree is not clean."
              git status --short
              exit 1
            fi

            # --------------------------------------------------
            # 3. Fetch and update main
            # --------------------------------------------------

            CURRENT_STEP="Fetching and updating main"
            echo ""
            echo "3. Fetching the latest main branch..."

            git fetch --prune origin main

            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
              echo "ERROR: Working tree changed during fetch."
              git status --short
              exit 1
            fi

            # Keep the deployment shell restrictive while ensuring
            # newly checked-out files are not created with mode 600.
            if ! (umask 022; git merge --ff-only origin/main); then
              echo "ERROR: Could not fast-forward to origin/main."
              echo "Resolve repository divergence before deploying."
              exit 1
            fi

            DEPLOY_COMMIT="$(git rev-parse HEAD)"

            echo "Deploying commit: $DEPLOY_COMMIT"
            git log -1 --format='%h %s'

            # --------------------------------------------------
            # 4. Validate files and normalize source permissions
            # --------------------------------------------------

            CURRENT_STEP="Validating application files and permissions"
            echo ""
            echo "4. Validating application files and permissions..."

            for FILE in \
              Dockerfile \
              docker/nginx.Dockerfile \
              docker/php/custom.ini \
              nginx/default.conf \
              composer.json \
              composer.lock \
              routes/api/v1/facebook.php \
              app/Http/Controllers/Api/Facebook/FacebookPostController.php
            do
              if [ ! -f "$FILE" ]; then
                echo "ERROR: Required file missing: $FILE"
                exit 1
              fi
            done

            # Laravel source directories must be traversable.
            # Source files must be readable by the PHP runtime.
            # These directories should contain application source,
            # not private keys or environment files.
            for DIR in app bootstrap config database resources routes; do
              if [ -d "$DIR" ]; then
                find "$DIR" -type d -exec chmod 755 {} +
                find "$DIR" -type f -exec chmod 644 {} +
              fi
            done

            for FILE in \
              routes/api/v1/facebook.php \
              app/Http/Controllers/Api/Facebook/FacebookPostController.php
            do
              MODE="$(stat -c '%a' "$FILE")"

              if [ "$MODE" != "644" ]; then
                echo "ERROR: Unexpected permissions for $FILE: $MODE"
                stat -c '%A %a %U:%G %n' "$FILE"
                exit 1
              fi

              echo "Verified source file:"
              stat -c '%A %a %U:%G %n' "$FILE"
            done

            if ! git diff --check; then
              echo "ERROR: Git whitespace/conflict-marker checks failed."
              exit 1
            fi

            # --------------------------------------------------
            # 5. Validate Compose configuration
            # --------------------------------------------------

            CURRENT_STEP="Validating Docker Compose configuration"
            echo ""
            echo "5. Validating Docker Compose configuration..."

            dc config --quiet

            # --------------------------------------------------
            # 6. Build production images
            # --------------------------------------------------

            CURRENT_STEP="Building production images"
            echo ""
            echo "6. Building production images..."

            dc build app nginx

            # --------------------------------------------------
            # 7. Validate files in the built Laravel image
            # --------------------------------------------------

            CURRENT_STEP="Validating built Laravel image"
            echo ""
            echo "7. Validating Laravel source files in the built image..."

            if ! dc run --rm --no-deps --entrypoint sh app -lc '
              set -eu

              for FILE in \
                /var/www/routes/api/v1/facebook.php \
                /var/www/app/Http/Controllers/Api/Facebook/FacebookPostController.php
              do
                if [ ! -f "$FILE" ]; then
                  echo "ERROR: Missing file: $FILE"
                  exit 1
                fi

                MODE="$(stat -c "%a" "$FILE")"

                echo "Checking $FILE"
                stat -c "%A %a %U:%G %n" "$FILE"

                if [ "$MODE" != "644" ]; then
                  echo "ERROR: Expected mode 644; found $MODE"
                  exit 1
                fi

                if [ ! -r "$FILE" ]; then
                  echo "ERROR: File is not readable: $FILE"
                  exit 1
                fi

                php -l "$FILE"
              done
            '; then
              echo "ERROR: Laravel source permission or syntax validation failed."
              echo "Inspect Dockerfile COPY instructions and Compose mounts."
              exit 1
            fi

            # --------------------------------------------------
            # 8. Start PostgreSQL and Redis
            # --------------------------------------------------

            CURRENT_STEP="Starting PostgreSQL and Redis"
            echo ""
            echo "8. Starting PostgreSQL and Redis..."

            dc up -d postgres redis

            # --------------------------------------------------
            # 9. Wait for PostgreSQL
            # --------------------------------------------------

            CURRENT_STEP="Waiting for PostgreSQL"
            echo ""
            echo "9. Waiting for PostgreSQL..."

            ATTEMPTS=0
            MAX_ATTEMPTS=36

            until dc exec -T postgres pg_isready >/dev/null 2>&1; do
              ATTEMPTS=$((ATTEMPTS + 1))

              if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
                echo "ERROR: PostgreSQL did not become ready."
                dc logs --tail=100 postgres
                exit 1
              fi

              sleep 5
            done

            echo "PostgreSQL is accepting connections."

            # --------------------------------------------------
            # 10. Wait for Redis
            # --------------------------------------------------

            CURRENT_STEP="Checking Redis"
            echo ""
            echo "10. Checking Redis..."

            ATTEMPTS=0
            REDIS_READY=0

            while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
              if dc exec -T redis redis-cli ping 2>/dev/null |
                grep -q '^PONG$'; then
                REDIS_READY=1
                break
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 2
            done

            if [ "$REDIS_READY" -ne 1 ]; then
              echo "ERROR: Redis did not become ready."
              dc logs --tail=100 redis
              exit 1
            fi

            echo "Redis is responding."

            # --------------------------------------------------
            # 11. Back up PostgreSQL before migrations
            # --------------------------------------------------

            CURRENT_STEP="Backing up PostgreSQL"
            echo ""
            echo "11. Backing up PostgreSQL before migrations..."

            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"

            BACKUP_FILE="$BACKUP_DIR/adama-civic-intelligence-$(date -u +%Y%m%dT%H%M%SZ).sql"

            if ! dc exec -T postgres sh -ec '
              test -n "${POSTGRES_USER:-}"
              test -n "${POSTGRES_DB:-}"

              pg_dump --no-owner --no-privileges \
                -U "$POSTGRES_USER" "$POSTGRES_DB"
            ' > "$BACKUP_FILE"; then
              rm -f "$BACKUP_FILE"
              echo "ERROR: PostgreSQL backup command failed."
              exit 1
            fi

            if [ ! -s "$BACKUP_FILE" ]; then
              rm -f "$BACKUP_FILE"
              echo "ERROR: PostgreSQL backup is empty."
              exit 1
            fi

            chmod 600 "$BACKUP_FILE"

            echo "Database backup created successfully."
            ls -lh "$BACKUP_FILE"

            # --------------------------------------------------
            # 12. Stop queue worker before schema changes
            # --------------------------------------------------

            CURRENT_STEP="Stopping queue worker"
            echo ""
            echo "12. Stopping the queue worker..."

            dc stop queue-worker
            WORKER_STOPPED=1

            # --------------------------------------------------
            # 13. Run migrations using the newly built image
            # --------------------------------------------------

            CURRENT_STEP="Running production migrations"
            echo ""
            echo "13. Running production migrations..."

            # A one-off container uses the new app image without
            # replacing the currently serving application container.
            if ! dc run --rm --no-deps app \
              php artisan migrate --force -vvv; then
              echo "ERROR: Production migrations failed."
              echo "Current migration status follows."

              dc run --rm --no-deps app \
                php artisan migrate:status || true

              echo "Database backup: $BACKUP_FILE"
              echo "No automatic database rollback was attempted."
              exit 1
            fi

            echo "Production migrations completed."

            # --------------------------------------------------
            # 14. Run optional production seeders
            # --------------------------------------------------

            CURRENT_STEP="Running optional production seeders"
            echo ""
            echo "14. Running optional production seeders..."

            if [ "${RUN_SEEDERS:-false}" = "true" ]; then
              echo "Seeder execution explicitly enabled."

              if ! dc run --rm --no-deps app \
                php artisan db:seed --force; then
                echo "ERROR: Production database seeders failed."
                echo "Database backup: $BACKUP_FILE"
                exit 1
              fi
            else
              echo "Seeders skipped."
            fi

            # --------------------------------------------------
            # 15. Start the updated Laravel application
            # --------------------------------------------------

            CURRENT_STEP="Starting Laravel application"
            echo ""
            echo "15. Starting the updated Laravel application..."

            dc up -d app

            APP_CONTAINER="$(dc ps -q app)"

            if [ -z "$APP_CONTAINER" ]; then
              echo "ERROR: Laravel container was not created."
              exit 1
            fi

            # --------------------------------------------------
            # 16. Wait for Laravel health
            # --------------------------------------------------

            CURRENT_STEP="Waiting for Laravel health"
            echo ""
            echo "16. Waiting for Laravel health..."

            ATTEMPTS=0
            MAX_ATTEMPTS=36
            APP_STATUS="starting"

            while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
              APP_STATUS="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                  "$APP_CONTAINER" 2>/dev/null || true
              )"

              if [ "$APP_STATUS" = "healthy" ]; then
                break
              fi

              if [ "$APP_STATUS" = "unhealthy" ] ||
                 [ "$APP_STATUS" = "missing" ]; then
                echo "ERROR: Laravel health status: $APP_STATUS"
                dc logs --tail=100 app
                exit 1
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 5
            done

            if [ "$APP_STATUS" != "healthy" ]; then
              echo "ERROR: Timed out waiting for Laravel health."
              dc logs --tail=100 app
              exit 1
            fi

            echo "Laravel container is healthy."

            # --------------------------------------------------
            # 17. Rebuild Laravel caches
            # --------------------------------------------------

            CURRENT_STEP="Rebuilding Laravel caches"
            echo ""
            echo "17. Rebuilding Laravel caches..."

            dc exec -T app php artisan optimize:clear
            dc exec -T app php artisan package:discover --ansi
            dc exec -T app php artisan config:cache
            dc exec -T app php artisan view:cache

            # --------------------------------------------------
            # 18. Validate route registration
            # --------------------------------------------------

            CURRENT_STEP="Verifying Laravel route registration"
            echo ""
            echo "18. Verifying Laravel route registration..."

            if ! dc exec -T app php artisan route:list --path=ping; then
              echo "ERROR: Ping route registration failed."
              dc logs --tail=100 app
              exit 1
            fi

            if ! dc exec -T app php artisan route:list --path=facebook/pages; then
              echo "ERROR: Facebook pages route registration failed."
              dc logs --tail=100 app
              exit 1
            fi

            # --------------------------------------------------
            # 19. Start updated Nginx
            # --------------------------------------------------

            CURRENT_STEP="Starting updated Nginx"
            echo ""
            echo "19. Starting updated Nginx..."

            dc up -d nginx

            # --------------------------------------------------
            # 20. Check Nginx health
            # --------------------------------------------------

            CURRENT_STEP="Checking Nginx health"
            echo ""
            echo "20. Checking Nginx health..."

            ATTEMPTS=0
            MAX_ATTEMPTS=24
            NGINX_HEALTHY=0

            while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
              if dc exec -T nginx \
                wget -q -O /dev/null \
                http://127.0.0.1/nginx-health; then
                NGINX_HEALTHY=1
                break
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 5
            done

            if [ "$NGINX_HEALTHY" -ne 1 ]; then
              echo "ERROR: Nginx health check failed."
              dc logs --tail=100 nginx
              exit 1
            fi

            echo "Nginx health check passed."

            # --------------------------------------------------
            # 21. Test the API
            # --------------------------------------------------

            CURRENT_STEP="Testing Laravel API"
            echo ""
            echo "21. Testing the Laravel API..."

            if ! API_RESPONSE="$(
              dc exec -T nginx wget -q -O - \
                http://127.0.0.1/api/ping
            )"; then
              echo "ERROR: API smoke-test request failed."
              exit 1
            fi

            if ! printf '%s' "$API_RESPONSE" |
              grep -Eq '"success"[[:space:]]*:[[:space:]]*true'; then
              echo "ERROR: API smoke test returned an unexpected response."
              printf '%s\n' "$API_RESPONSE"
              exit 1
            fi

            echo "API smoke test passed."
            printf '%s\n' "$API_RESPONSE"

            # --------------------------------------------------
            # 22. Restart and verify queue worker
            # --------------------------------------------------

            CURRENT_STEP="Restarting and verifying queue worker"
            echo ""
            echo "22. Restarting the updated queue worker..."

            dc up -d --force-recreate queue-worker

            WORKER_CONTAINER="$(dc ps -q queue-worker)"

            if [ -z "$WORKER_CONTAINER" ]; then
              echo "ERROR: Queue worker container was not created."
              exit 1
            fi

            WORKER_STATE="$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$WORKER_CONTAINER"
            )"

            if [ "$WORKER_STATE" != "running" ]; then
              echo "ERROR: Queue worker is not running: $WORKER_STATE"
              dc logs --tail=100 queue-worker
              exit 1
            fi

            WORKER_STOPPED=0
            echo "Queue worker is running."

            # --------------------------------------------------
            # 23. Final verification
            # --------------------------------------------------

            CURRENT_STEP="Final service verification"
            echo ""
            echo "23. Final service status..."

            dc ps

            echo ""
            echo "Deployed commit: $DEPLOY_COMMIT"
            echo "Database backup: $BACKUP_FILE"

            echo ""
            echo "=========================================="
            echo "Deployment completed successfully."
            echo "=========================================="

            trap - EXIT
