name: Deploy Mayor Sentiment Laravel API

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mayor-sentiment-api-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Laravel API to ASI Serv
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 25m
          envs: DEPLOY_PATH

          script: |
            set -eu

            APP_DIR="${DEPLOY_PATH:-/opt/asi-platform/apps/facebook-sentiment-api}"

            echo "=========================================="
            echo "Mayor Sentiment API Deployment"
            echo "Target: ASI Serv"
            echo "Application: $APP_DIR"
            echo "=========================================="

            # 1. Verify application directory

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: Git repository not found at $APP_DIR"
              echo "Expected the repository directly inside the API directory."
              exit 1
            fi

            cd "$APP_DIR"

            # 2. Configure deployment failure diagnostics

            on_error() {
              status=$?

              if [ "$status" -ne 0 ]; then
                echo ""
                echo "=========================================="
                echo "DEPLOYMENT FAILED (exit code: $status)"
                echo "=========================================="

                docker compose logs --tail=80 \
                  app nginx queue-worker redis || true

                echo ""
                echo "Container status:"
                docker compose ps || true
              fi
            }

            trap on_error EXIT

            # 3. Verify repository state

            echo ""
            echo "1. Checking repository state..."

            CURRENT_BRANCH="$(git branch --show-current)"

            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "ERROR: Expected branch main, found: $CURRENT_BRANCH"
              exit 1
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: Working tree contains local changes."
              git status --short
              echo "No local changes have been discarded."
              exit 1
            fi

            # 4. Fetch and fast-forward

            echo ""
            echo "2. Fetching latest main branch..."

            git fetch origin main

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: Working tree changed during fetch."
              exit 1
            fi

            git merge --ff-only origin/main

            echo ""
            echo "Deployed commit:"
            git log -1 --format='%h %s'

            # 5. Validate deployment files

            echo ""
            echo "3. Checking required files..."

            for FILE in \
              compose.yaml \
              Dockerfile
            do
              if [ ! -f "$FILE" ]; then
                echo "ERROR: Required file is missing: $FILE"
                exit 1
              fi
            done

            # 6. Validate Docker and Compose

            echo ""
            echo "4. Validating Docker Compose..."

            docker --version
            docker compose version
            docker compose -f compose.yaml config --quiet

            # 7. Verify shared Traefik network

            echo ""
            echo "5. Verifying Traefik network..."

            if ! docker network inspect traefik-public >/dev/null 2>&1; then
              echo "ERROR: traefik-public network does not exist."
              echo "Configure the shared Traefik stack first."
              exit 1
            fi

            # 8. Build production images

            echo ""
            echo "6. Building production images..."

            docker compose -f compose.yaml build app nginx

            # 9. Start application and Redis

            echo ""
            echo "7. Starting Laravel HTTP services..."

            docker compose -f compose.yaml up -d redis app nginx

            # 10. Wait for Laravel health

            echo ""
            echo "8. Waiting for Laravel application health..."

            APP_CONTAINER="$(
              docker compose -f compose.yaml ps -q app
            )"

            if [ -z "$APP_CONTAINER" ]; then
              echo "ERROR: Laravel app container was not created."
              exit 1
            fi

            ATTEMPTS=0
            MAX_ATTEMPTS=30
            STATUS="starting"

            while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
              STATUS="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                  "$APP_CONTAINER" 2>/dev/null || true
              )"

              if [ "$STATUS" = "healthy" ]; then
                echo "Laravel application is healthy."
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "ERROR: Laravel application is unhealthy."
                docker compose -f compose.yaml logs --tail=100 app
                exit 1
              fi

              if [ "$STATUS" = "missing" ]; then
                echo "ERROR: No Docker healthcheck is configured for app."
                echo "Configure a valid healthcheck in compose.yaml."
                exit 1
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "ERROR: Timed out waiting for Laravel health."
              docker compose -f compose.yaml logs --tail=100 app
              exit 1
            fi

            # 11. Verify Laravel package discovery

            echo ""
            echo "9. Verifying Laravel package discovery..."

            docker compose -f compose.yaml exec -T app \
              php artisan package:discover --ansi

            # 12. Run production database migrations

            echo ""
            echo "10. Running database migrations..."

            docker compose -f compose.yaml exec -T app \
              php artisan migrate --force

            # 13. Rebuild Laravel caches

            echo ""
            echo "11. Rebuilding Laravel production caches..."

            docker compose -f compose.yaml exec -T app \
              php artisan optimize:clear

            docker compose -f compose.yaml exec -T app \
              php artisan config:cache

            docker compose -f compose.yaml exec -T app \
              php artisan route:cache

            docker compose -f compose.yaml exec -T app \
              php artisan view:cache

            # 14. Verify internal Nginx

            echo ""
            echo "12. Verifying internal Nginx..."

            docker compose -f compose.yaml exec -T nginx \
              wget -q -O /dev/null http://127.0.0.1/nginx-health

            echo "Internal Nginx health check passed."

            # 15. Start queue worker

            echo ""
            echo "13. Starting queue worker..."

            docker compose -f compose.yaml up -d queue-worker

            # 16. Verify final services

            echo ""
            echo "14. Verifying deployed services..."

            docker compose -f compose.yaml ps

            echo ""
            echo "Laravel environment:"
            docker compose -f compose.yaml exec -T app \
              php artisan about --only=environment

            echo ""
            echo "Recent queue worker logs:"
            docker compose -f compose.yaml logs --tail=20 queue-worker || true

            echo ""
            echo "=========================================="
            echo "Laravel API deployment completed successfully."
            echo "=========================================="

            trap - EXIT
