name: Deploy Mayor Sentiment Laravel API

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      seed_database:
        description: "Run production database seeders after migrations"
        required: true
        type: boolean
        default: false

concurrency:
  group: mayor-sentiment-api-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Laravel API to ASI Serv
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      RUN_SEEDERS: ${{ inputs.seed_database || false }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RUN_SEEDERS: ${{ inputs.seed_database || false }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 35m
          envs: DEPLOY_PATH,RUN_SEEDERS

          script: |
            set -eu
            umask 077

            APP_DIR="${DEPLOY_PATH:-/opt/asi-platform/apps/facebook-sentiment-api}"
            BACKUP_DIR="/opt/asi-platform/backups/facebook-sentiment-api"

            WORKER_STOPPED=0
            CURRENT_STEP="Initializing deployment"

            echo "=========================================="
            echo "Mayor Sentiment API Deployment"
            echo "Target: ASI Serv"
            echo "Application: $APP_DIR"
            echo "=========================================="

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: Git repository not found: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            if [ -f compose.yaml ]; then
              COMPOSE_FILE="compose.yaml"
            elif [ -f compose.yml ]; then
              COMPOSE_FILE="compose.yml"
            elif [ -f docker-compose.yml ]; then
              COMPOSE_FILE="docker-compose.yml"
            elif [ -f docker-compose.yaml ]; then
              COMPOSE_FILE="docker-compose.yaml"
            else
              echo "ERROR: Docker Compose file not found."
              exit 1
            fi

            dc() {
              docker compose -f "$COMPOSE_FILE" "$@"
            }

            on_exit() {
              STATUS=$?

              if [ "$STATUS" -ne 0 ]; then
                trap - EXIT
                set +e

                echo ""
                echo "=========================================="
                echo "DEPLOYMENT FAILED"
                echo "Exit code: $STATUS"
                echo "Last step: $CURRENT_STEP"
                echo "=========================================="

                echo ""
                echo "--- Container status ---"
                dc ps

                echo ""
                echo "--- Recent application logs ---"
                dc logs --tail=100 \
                  app nginx queue-worker postgres redis

                if [ "$WORKER_STOPPED" -eq 1 ]; then
                  echo ""
                  echo "--- Attempting queue-worker recovery ---"

                  if dc up -d queue-worker; then
                    WORKER_CONTAINER="$(dc ps -q queue-worker)"

                    if [ -n "$WORKER_CONTAINER" ]; then
                      WORKER_STATE="$(
                        docker inspect \
                          --format '{{.State.Status}}' \
                          "$WORKER_CONTAINER" 2>/dev/null
                      )"

                      if [ "$WORKER_STATE" = "running" ]; then
                        echo "Queue worker recovery succeeded."
                      else
                        echo "WARNING: Queue worker state: $WORKER_STATE"
                        dc logs --tail=100 queue-worker
                      fi
                    else
                      echo "WARNING: Queue worker container was not found."
                    fi
                  else
                    echo "WARNING: Queue worker recovery failed."
                  fi
                fi

                echo ""
                echo "No automatic database rollback was attempted."
                echo "Check migration status before retrying."
              fi

              trap - EXIT
              exit "$STATUS"
            }

            trap on_exit EXIT

            CURRENT_STEP="Checking deployment prerequisites"
            echo ""
            echo "1. Checking deployment prerequisites..."

            docker --version
            docker compose version

            if ! docker network inspect traefik-public >/dev/null 2>&1; then
              echo "ERROR: Docker network traefik-public is missing."
              exit 1
            fi

            if [ ! -f .env ] || [ ! -f .env.postgres ]; then
              echo "ERROR: Required .env or .env.postgres is missing."
              exit 1
            fi

            chmod 600 .env .env.postgres

            case "${RUN_SEEDERS:-false}" in
              true|false)
                ;;
              *)
                echo "ERROR: RUN_SEEDERS must be true or false."
                exit 1
                ;;
            esac

            CURRENT_STEP="Validating repository state"
            echo ""
            echo "2. Validating repository state..."

            CURRENT_BRANCH="$(git branch --show-current)"

            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "ERROR: Expected main branch, found '$CURRENT_BRANCH'."
              exit 1
            fi

            if git ls-files --error-unmatch .env.postgres >/dev/null 2>&1; then
              echo "ERROR: .env.postgres must not be tracked by Git."
              exit 1
            fi

            # Exclude only this server-specific environment file.
            # Never add production secrets to the repository.
            EXCLUDE_FILE="$(git rev-parse --git-path info/exclude)"
            touch "$EXCLUDE_FILE"

            if ! grep -qxF '/.env.postgres' "$EXCLUDE_FILE"; then
              printf '\n/.env.postgres\n' >> "$EXCLUDE_FILE"
            fi

            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
              echo "ERROR: Git working tree is not clean."
              git status --short
              exit 1
            fi

            CURRENT_STEP="Fetching and updating main"
            echo ""
            echo "3. Fetching the latest main branch..."

            git fetch --prune origin main

            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
              echo "ERROR: Working tree changed during fetch."
              git status --short
              exit 1
            fi

            git merge --ff-only origin/main

            DEPLOY_COMMIT="$(git rev-parse HEAD)"

            echo "Deploying commit: $DEPLOY_COMMIT"
            git log -1 --format='%h %s'

            CURRENT_STEP="Validating application files"
            echo ""
            echo "4. Validating required application files..."

            for FILE in \
              Dockerfile \
              docker/nginx.Dockerfile \
              docker/php/custom.ini \
              nginx/default.conf \
              composer.json \
              composer.lock
            do
              if [ ! -f "$FILE" ]; then
                echo "ERROR: Required file missing: $FILE"
                exit 1
              fi
            done

            CURRENT_STEP="Validating Docker Compose configuration"
            echo ""
            echo "5. Validating Docker Compose configuration..."

            dc config --quiet

            CURRENT_STEP="Building production images"
            echo ""
            echo "6. Building production images..."

            dc build app nginx

            CURRENT_STEP="Starting PostgreSQL and Redis"
            echo ""
            echo "7. Starting PostgreSQL and Redis..."

            dc up -d postgres redis

            CURRENT_STEP="Waiting for PostgreSQL"
            echo ""
            echo "8. Waiting for PostgreSQL..."

            ATTEMPTS=0
            MAX_ATTEMPTS=36

            until dc exec -T postgres pg_isready >/dev/null 2>&1; do
              ATTEMPTS=$((ATTEMPTS + 1))

              if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
                echo "ERROR: PostgreSQL did not become ready."
                dc logs --tail=100 postgres
                exit 1
              fi

              sleep 5
            done

            echo "PostgreSQL is accepting connections."

            CURRENT_STEP="Checking Redis"
            echo ""
            echo "9. Checking Redis..."

            ATTEMPTS=0
            REDIS_READY=0

            while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
              if dc exec -T redis redis-cli ping 2>/dev/null |
                grep -q '^PONG$'; then
                REDIS_READY=1
                break
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 2
            done

            if [ "$REDIS_READY" -ne 1 ]; then
              echo "ERROR: Redis did not become ready."
              dc logs --tail=100 redis
              exit 1
            fi

            echo "Redis is responding."

            CURRENT_STEP="Stopping queue worker"
            echo ""
            echo "10. Stopping the queue worker..."

            dc stop queue-worker
            WORKER_STOPPED=1

            CURRENT_STEP="Starting Laravel application"
            echo ""
            echo "11. Starting the Laravel application..."

            dc up -d app

            APP_CONTAINER="$(dc ps -q app)"

            if [ -z "$APP_CONTAINER" ]; then
              echo "ERROR: Laravel container was not created."
              exit 1
            fi

            CURRENT_STEP="Waiting for Laravel health"
            echo ""
            echo "12. Waiting for Laravel health..."

            ATTEMPTS=0
            MAX_ATTEMPTS=36
            APP_STATUS="starting"

            while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
              APP_STATUS="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                  "$APP_CONTAINER" 2>/dev/null || true
              )"

              if [ "$APP_STATUS" = "healthy" ]; then
                break
              fi

              if [ "$APP_STATUS" = "unhealthy" ] ||
                 [ "$APP_STATUS" = "missing" ]; then
                echo "ERROR: Laravel health status: $APP_STATUS"
                dc logs --tail=100 app
                exit 1
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 5
            done

            if [ "$APP_STATUS" != "healthy" ]; then
              echo "ERROR: Timed out waiting for Laravel health."
              dc logs --tail=100 app
              exit 1
            fi

            echo "Laravel is healthy."

            CURRENT_STEP="Rebuilding Laravel caches"
            echo ""
            echo "13. Rebuilding Laravel caches..."

            dc exec -T app php artisan optimize:clear
            dc exec -T app php artisan package:discover --ansi
            dc exec -T app php artisan config:cache
            dc exec -T app php artisan view:cache

            CURRENT_STEP="Backing up PostgreSQL"
            echo ""
            echo "14. Backing up PostgreSQL before migrations..."

            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"

            BACKUP_FILE="$BACKUP_DIR/adama-civic-intelligence-$(date -u +%Y%m%dT%H%M%SZ).sql"

            if ! dc exec -T postgres sh -ec \
              'test -n "${POSTGRES_USER:-}" &&
               test -n "${POSTGRES_DB:-}" &&
               pg_dump --no-owner --no-privileges \
                 -U "$POSTGRES_USER" "$POSTGRES_DB"' \
              > "$BACKUP_FILE"; then
              rm -f "$BACKUP_FILE"
              echo "ERROR: PostgreSQL backup command failed."
              exit 1
            fi

            if [ ! -s "$BACKUP_FILE" ]; then
              rm -f "$BACKUP_FILE"
              echo "ERROR: PostgreSQL backup is empty."
              exit 1
            fi

            chmod 600 "$BACKUP_FILE"

            echo "Database backup created successfully."
            ls -lh "$BACKUP_FILE"

            CURRENT_STEP="Running production migrations"
            echo ""
            echo "15. Running production migrations..."

            if ! dc exec -T app php artisan migrate --force -vvv; then
              echo "ERROR: Laravel production migrations failed."
              echo "Current migration status follows."

              dc exec -T app php artisan migrate:status || true

              echo "No automatic database rollback was attempted."
              exit 1
            fi

            echo "Production migrations completed."

            CURRENT_STEP="Running optional production seeders"
            echo ""
            echo "16. Running optional production seeders..."

            if [ "${RUN_SEEDERS:-false}" = "true" ]; then
              echo "Seeder execution explicitly enabled."

              if ! dc exec -T app php artisan db:seed --force; then
                echo "ERROR: Production database seeders failed."
                exit 1
              fi
            else
              echo "Seeders skipped."
            fi

            CURRENT_STEP="Starting updated Nginx"
            echo ""
            echo "17. Starting updated Nginx..."

            dc up -d nginx

            CURRENT_STEP="Checking Nginx health"
            echo ""
            echo "18. Checking Nginx health..."

            ATTEMPTS=0
            MAX_ATTEMPTS=24
            NGINX_HEALTHY=0

            while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
              if dc exec -T nginx \
                wget -q -O /dev/null \
                http://127.0.0.1/nginx-health; then
                NGINX_HEALTHY=1
                break
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 5
            done

            if [ "$NGINX_HEALTHY" -ne 1 ]; then
              echo "ERROR: Nginx health check failed."
              dc logs --tail=100 nginx
              exit 1
            fi

            echo "Nginx health check passed."

            CURRENT_STEP="Testing Laravel API"
            echo ""
            echo "19. Testing the Laravel API..."

            if ! API_RESPONSE="$(
              dc exec -T nginx wget -q -O - \
                http://127.0.0.1/api/ping
            )"; then
              echo "ERROR: API smoke-test request failed."
              exit 1
            fi

            if ! printf '%s' "$API_RESPONSE" |
              grep -Eq '"success"[[:space:]]*:[[:space:]]*true'; then
              echo "ERROR: API smoke test returned an unexpected response."
              printf '%s\n' "$API_RESPONSE"
              exit 1
            fi

            echo "API smoke test passed."
            printf '%s\n' "$API_RESPONSE"

            CURRENT_STEP="Restarting and verifying queue worker"
            echo ""
            echo "20. Restarting the updated queue worker..."

            dc up -d --force-recreate queue-worker

            WORKER_CONTAINER="$(dc ps -q queue-worker)"

            if [ -z "$WORKER_CONTAINER" ]; then
              echo "ERROR: Queue worker container was not created."
              exit 1
            fi

            WORKER_STATE="$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$WORKER_CONTAINER"
            )"

            if [ "$WORKER_STATE" != "running" ]; then
              echo "ERROR: Queue worker is not running: $WORKER_STATE"
              dc logs --tail=100 queue-worker
              exit 1
            fi

            WORKER_STOPPED=0
            echo "Queue worker is running."

            CURRENT_STEP="Final service verification"
            echo ""
            echo "21. Final service status..."

            dc ps

            echo ""
            echo "Deployed commit: $DEPLOY_COMMIT"
            echo "Database backup: $BACKUP_FILE"

            echo ""
            echo "=========================================="
            echo "Deployment completed successfully."
            echo "=========================================="

            trap - EXIT
