name: Deploy Mayor Sentiment Laravel API

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mayor-sentiment-api-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Laravel API to ASI Serv
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 25m
          envs: DEPLOY_PATH

          script: |
            set -eu

            APP_DIR="${DEPLOY_PATH:-/opt/asi-platform/apps/facebook-sentiment-api}"

            echo "=========================================="
            echo "Mayor Sentiment API Deployment"
            echo "Target: ASI Serv"
            echo "Application: $APP_DIR"
            echo "=========================================="

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: Git repository not found."
              exit 1
            fi

            cd "$APP_DIR"

            on_error() {
              status=$?

              if [ "$status" -ne 0 ]; then
                echo ""
                echo "=========================================="
                echo "DEPLOYMENT FAILED: exit code $status"
                echo "=========================================="

                docker compose -f "$COMPOSE_FILE" logs \
                  --tail=80 app nginx queue-worker postgres redis 2>/dev/null || true

                docker compose -f "$COMPOSE_FILE" ps || true
              fi
            }

            # Select the repository's actual Compose filename.
            if [ -f compose.yaml ]; then
              COMPOSE_FILE="compose.yaml"
            elif [ -f docker-compose.yml ]; then
              COMPOSE_FILE="docker-compose.yml"
            else
              echo "ERROR: No supported Compose file found."
              exit 1
            fi

            trap on_error EXIT

            echo ""
            echo "1. Checking repository state..."

            CURRENT_BRANCH="$(git branch --show-current)"

            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "ERROR: Expected branch main; found $CURRENT_BRANCH."
              exit 1
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: Working tree contains local changes."
              git status --short
              exit 1
            fi

            echo ""
            echo "2. Fetching latest main..."

            git fetch origin main

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: Working tree changed during fetch."
              exit 1
            fi

            git merge --ff-only origin/main

            echo "Deploying commit:"
            git log -1 --format='%h %s'

            echo ""
            echo "3. Checking required files..."

            for FILE in \
              Dockerfile \
              docker/nginx.Dockerfile \
              docker/php/custom.ini \
              nginx/default.conf \
              composer.json \
              composer.lock
            do
              if [ ! -f "$FILE" ]; then
                echo "ERROR: Required file is missing: $FILE"
                exit 1
              fi
            done

            if [ ! -f .env ] || [ ! -f .env.postgres ]; then
              echo "ERROR: Required runtime environment file is missing."
              exit 1
            fi

            echo ""
            echo "4. Validating Docker Compose..."

            docker --version
            docker compose version
            docker compose -f "$COMPOSE_FILE" config --quiet

            echo ""
            echo "5. Checking the shared Traefik network..."

            if ! docker network inspect traefik-public >/dev/null 2>&1; then
              echo "ERROR: traefik-public network does not exist."
              exit 1
            fi

            echo ""
            echo "6. Building application images..."

            docker compose -f "$COMPOSE_FILE" build app nginx

            echo ""
            echo "7. Starting application dependencies..."

            docker compose -f "$COMPOSE_FILE" up -d postgres redis

            echo ""
            echo "8. Starting Laravel and Nginx..."

            docker compose -f "$COMPOSE_FILE" up -d app nginx

            APP_CONTAINER="$(
              docker compose -f "$COMPOSE_FILE" ps -q app
            )"

            if [ -z "$APP_CONTAINER" ]; then
              echo "ERROR: Laravel app container was not created."
              exit 1
            fi

            echo ""
            echo "9. Waiting for Laravel health..."

            ATTEMPTS=0
            MAX_ATTEMPTS=36
            STATUS="starting"

            while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
              STATUS="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                  "$APP_CONTAINER" 2>/dev/null || true
              )"

              if [ "$STATUS" = "healthy" ]; then
                echo "Laravel application is healthy."
                break
              fi

              if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "missing" ]; then
                echo "ERROR: Laravel health check failed: $STATUS"
                docker compose -f "$COMPOSE_FILE" logs --tail=100 app
                exit 1
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "ERROR: Timed out waiting for Laravel."
              docker compose -f "$COMPOSE_FILE" logs --tail=100 app
              exit 1
            fi

            echo ""
            echo "10. Preparing Laravel package discovery..."

            docker compose -f "$COMPOSE_FILE" exec -T app \
              php artisan package:discover --ansi

            echo ""
            echo "11. Rebuilding Laravel configuration cache..."

            docker compose -f "$COMPOSE_FILE" exec -T app \
              php artisan optimize:clear

            docker compose -f "$COMPOSE_FILE" exec -T app \
              php artisan config:cache

            echo ""
            echo "12. Running production database migrations..."

            docker compose -f "$COMPOSE_FILE" exec -T app \
              php artisan migrate --force

            echo ""
            echo "13. Caching Laravel views..."

            docker compose -f "$COMPOSE_FILE" exec -T app \
              php artisan view:cache

            echo ""
            echo "14. Verifying Nginx health..."

            docker compose -f "$COMPOSE_FILE" exec -T nginx \
              wget -q -O /dev/null \
              http://127.0.0.1/nginx-health

            echo "Nginx health check passed."

            echo ""
            echo "15. Testing the Laravel API response..."

            API_RESPONSE="$(
              docker compose -f "$COMPOSE_FILE" exec -T nginx \
                wget -q -O - http://127.0.0.1/api/ping
            )"

            if ! printf '%s' "$API_RESPONSE" | grep -q '"success":true'; then
              echo "ERROR: API smoke test failed."
              echo "The API did not return the expected success field."
              exit 1
            fi

            echo "API smoke test passed."

            echo ""
            echo "16. Restarting the queue worker..."

            docker compose -f "$COMPOSE_FILE" up -d \
              --force-recreate queue-worker

            echo ""
            echo "17. Final service status..."

            docker compose -f "$COMPOSE_FILE" ps

            echo ""
            echo "Deployment commit:"
            git log -1 --format='%h %s'

            echo ""
            echo "=========================================="
            echo "Deployment completed."
            echo "Note: Sanctum cookie behavior must also be"
            echo "verified independently before sign-off."
            echo "=========================================="

            trap - EXIT
